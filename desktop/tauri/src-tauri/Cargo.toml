[package]
name = "keyloom-desktop"
version = "0.0.0" # the app version is passed at build time from the keyloom version (scripts/build.sh), so release-please never edits this file
edition = "2021"
description = "Native shell around keyloom serve: window, menu-bar extra, notifications, launch at login"
license = "AGPL-3.0-or-later"

[features]
# Built only when TAURI_SIGNING_PRIVATE_KEY and the public key exist; see desktop/tauri/README.md.
updater = ["dep:tauri-plugin-updater"]

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.5.0"
tauri-plugin-notification = "2.7.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = { version = "2.14.0", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
url = "2"
tokio = { version = "1", features = ["time", "signal", "macros"] }

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
