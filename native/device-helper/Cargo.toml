[package]
name = "keyloom-device"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[features]
default = []
native-hid = ["dep:core-foundation", "dep:base64", "dep:getrandom"]
synthetic-hid = ["dep:base64", "dep:getrandom"]
synthetic-capture = ["synthetic-hid"]

[dependencies]
serde_json = "=1.0.154"
base64 = { version = "=0.22.1", optional = true }
getrandom = { version = "=0.3.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "=0.10.1", optional = true }

[build-dependencies]
serde_json = "=1.0.154"
