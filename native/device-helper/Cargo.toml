[package]
name = "keyloom-device"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[features]
default = []
native-windows = ["dep:windows-sys", "dep:base64", "dep:getrandom"]
native-linux = ["dep:base64", "dep:getrandom", "dep:libc"]
native-macos = ["native-hid", "native-serial"]
synthetic-windows = ["synthetic-capture", "synthetic-serial-capture"]
synthetic-macos = ["synthetic-capture", "synthetic-serial-capture"]
native-serial = ["dep:core-foundation", "dep:base64", "dep:getrandom", "dep:libc"]
native-hid = ["dep:core-foundation", "dep:base64", "dep:getrandom"]
synthetic-hid = ["dep:base64", "dep:getrandom"]
synthetic-capture = ["synthetic-hid"]
synthetic-serial = ["dep:base64", "dep:getrandom"]
synthetic-serial-capture = ["synthetic-serial"]

[dependencies]
serde_json = "=1.0.154"
base64 = { version = "=0.22.1", optional = true }
getrandom = { version = "=0.3.4", optional = true }
libc = { version = "=0.2.191", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "=0.10.1", optional = true }

[build-dependencies]
serde_json = "=1.0.154"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", optional = true, features = ["Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Foundation", "Win32_Devices_Communication", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry"] }
