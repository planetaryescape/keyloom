[package]
name = "keyloom-device"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[features]
default = []
native-macos = ["native-hid", "native-serial"]
synthetic-macos = ["synthetic-capture", "synthetic-serial-capture"]
native-serial = ["dep:core-foundation", "dep:base64", "dep:getrandom", "dep:libc"]
native-hid = ["dep:core-foundation", "dep:base64", "dep:getrandom"]
synthetic-hid = ["dep:base64", "dep:getrandom"]
synthetic-capture = ["synthetic-hid"]
synthetic-serial = ["dep:base64", "dep:getrandom"]
synthetic-serial-capture = ["synthetic-serial"]

[dependencies]
serde_json = "=1.0.154"
base64 = { version = "=0.22.1", optional = true }
getrandom = { version = "=0.3.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "=0.2.191", optional = true }
core-foundation = { version = "=0.10.1", optional = true }

[build-dependencies]
serde_json = "=1.0.154"
