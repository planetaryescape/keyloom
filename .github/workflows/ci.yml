name: ci

on:
  push:
  pull_request:
  # release.yml dispatches this on release-please's branch: the PR that bot opens with the
  # default token never starts pull_request workflows (docs/issues/release-pr-ci-never-runs.md).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - name: Dependency rules
        run: |
          if jq -e '.scripts.depcruise' package.json >/dev/null; then
            bun run depcruise
          else
            echo "No depcruise script yet, skipping."
          fi

  # Diagnostics has no native device backend; Windows also exercises the installed CLI.
  device-helper:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, rust: aarch64-apple-darwin, bun: bun-darwin-arm64, exe: "" }
          - { os: macos-15-intel, rust: x86_64-apple-darwin, bun: bun-darwin-x64, exe: "" }
          - { os: ubuntu-22.04, rust: x86_64-unknown-linux-musl, bun: bun-linux-x64, exe: "" }
          - { os: windows-2022, rust: x86_64-pc-windows-msvc, bun: bun-windows-x64, exe: ".exe" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Native HID compile gate (no device invocation)
        if: runner.os == 'macOS'
        shell: bash
        working-directory: native/device-helper
        run: |
          cargo clippy --locked --all-targets --features native-hid -- -D warnings
          cargo test --locked --features native-hid
      - name: Synthetic-only native HID contract
        shell: bash
        run: |
          cd native/device-helper
          rustup target add "${{ matrix.rust }}"
          cargo clippy --locked --all-targets --target "${{ matrix.rust }}" --features synthetic-hid -- -D warnings
          cargo test --locked --target "${{ matrix.rust }}" --features synthetic-hid
          cargo build --locked --target "${{ matrix.rust }}" --features synthetic-hid
          cp "target/${{ matrix.rust }}/debug/keyloom-device${{ matrix.exe }}" "target/${{ matrix.rust }}/debug/keyloom-device-synthetic${{ matrix.exe }}"
          cd ../..
          KEYLOOM_TEST_SYNTHETIC_HID="$PWD/native/device-helper/target/${{ matrix.rust }}/debug/keyloom-device-synthetic${{ matrix.exe }}" bun test test/firmware/toolchain/device-helper-hid.test.ts test/firmware/toolchain/device-helper-client-order.test.ts
      - name: Installed candidate CLI over compile-only synthetic capture (no devices)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd native/device-helper
          cargo build --locked --release --target "${{ matrix.rust }}" --features synthetic-capture
          cp "target/${{ matrix.rust }}/release/keyloom-device" "target/${{ matrix.rust }}/release/keyloom-device-synthetic-capture"
          codesign --force --sign - "target/${{ matrix.rust }}/release/keyloom-device-synthetic-capture"
          cd ../..
          helper="$PWD/native/device-helper/target/${{ matrix.rust }}/release/keyloom-device-synthetic-capture"
          bun scripts/build-binaries.ts --target "${{ matrix.bun }}" --device-backend native-hid --helper "$helper" --out-dir dist/native-candidate-test
          bun scripts/smoke-native-hid-candidate.ts "dist/native-candidate-test/keyloom-${{ matrix.rust == 'aarch64-apple-darwin' && 'darwin-arm64' || 'darwin-x64' }}" "$helper"
      - name: Direct macOS serial compile and diagnostics (no discovery)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd native/device-helper
          cargo clippy --locked --all-targets --target "${{ matrix.rust }}" --features native-serial -- -D warnings
          cargo test --locked --target "${{ matrix.rust }}" --features native-serial
          cd ../..
          bun scripts/build-binaries.ts --target "${{ matrix.bun }}" --device-backend native-serial --out-dir dist/native-serial-source-test
          candidate="dist/native-serial-source-test/keyloom-${{ matrix.rust == 'aarch64-apple-darwin' && 'darwin-arm64' || 'darwin-x64' }}"
          "$candidate" --version
          scratch=$(mktemp -d)
          HOME="$scratch" XDG_CACHE_HOME="$scratch/cache" "$candidate" --data-dir "$scratch/data" doctor --device-helper-only --format json > "$scratch/doctor.json"
          bun -e 'const result = await Bun.file(process.argv[1]).json(); if (JSON.stringify(result.checks[0].deviceHelper.capabilities) !== JSON.stringify(["serial.list", "serial.open", "serial.touch.1200", "serial.touch.1201"]) || !result.checks[0].deviceHelper.available || result.checks.length !== 1 || !result.ok) throw new Error(JSON.stringify(result));' "$scratch/doctor.json"
          rm -rf "$scratch"
      - name: Synthetic serial contract and installed candidate (no devices)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd native/device-helper
          cargo clippy --locked --all-targets --target "${{ matrix.rust }}" --features synthetic-serial -- -D warnings
          cargo test --locked --target "${{ matrix.rust }}" --features synthetic-serial
          cargo build --locked --target "${{ matrix.rust }}" --features synthetic-serial
          cp "target/${{ matrix.rust }}/debug/keyloom-device" "target/${{ matrix.rust }}/debug/keyloom-device-synthetic-serial"
          codesign --force --sign - "target/${{ matrix.rust }}/debug/keyloom-device-synthetic-serial"
          cd ../..
          KEYLOOM_TEST_SYNTHETIC_SERIAL="$PWD/native/device-helper/target/${{ matrix.rust }}/debug/keyloom-device-synthetic-serial" bun test test/firmware/toolchain/device-helper-serial.test.ts
          cd native/device-helper
          cargo build --locked --release --target "${{ matrix.rust }}" --features synthetic-serial-capture
          cp "target/${{ matrix.rust }}/release/keyloom-device" "target/${{ matrix.rust }}/release/keyloom-device-synthetic-serial-capture"
          codesign --force --sign - "target/${{ matrix.rust }}/release/keyloom-device-synthetic-serial-capture"
          cd ../..
          helper="$PWD/native/device-helper/target/${{ matrix.rust }}/release/keyloom-device-synthetic-serial-capture"
          bun scripts/build-binaries.ts --target "${{ matrix.bun }}" --device-backend native-serial --helper "$helper" --out-dir dist/native-serial-candidate-test
          bun scripts/smoke-native-serial-candidate.ts "dist/native-serial-candidate-test/keyloom-${{ matrix.rust == 'aarch64-apple-darwin' && 'darwin-arm64' || 'darwin-x64' }}" "$helper"
      - name: Locked Rust checks and native diagnostics build
        shell: bash
        working-directory: native/device-helper
        run: |
          rustup show
          rustup target add "${{ matrix.rust }}"
          cargo fmt --check
          cargo check --locked --target "${{ matrix.rust }}"
          cargo clippy --locked --all-targets --target "${{ matrix.rust }}" -- -D warnings
          cargo test --locked --target "${{ matrix.rust }}"
          cargo build --locked --release --target "${{ matrix.rust }}"
          cargo test --locked --release --target "${{ matrix.rust }}" --test lifetime -- --nocapture
      - name: Ad-hoc helper signature before embedding
        if: runner.os == 'macOS'
        run: codesign --force --sign - native/device-helper/target/${{ matrix.rust }}/release/keyloom-device
      - name: Verify no Linux dynamic interpreter
        if: runner.os == 'Linux'
        run: |
          file native/device-helper/target/${{ matrix.rust }}/release/keyloom-device
          if readelf -l native/device-helper/target/${{ matrix.rust }}/release/keyloom-device | grep -q INTERP; then exit 1; fi
      - name: Native Bun child contract and lifetime
        id: child-contract
        env:
          KEYLOOM_TEST_HELPER: ${{ github.workspace }}/native/device-helper/target/${{ matrix.rust }}/release/keyloom-device${{ matrix.exe }}
        run: bun test test/firmware/toolchain/device-helper.test.ts test/firmware/toolchain/device-helper-native.test.ts
      - name: Repeat Intel release-profile OS-pipe backpressure oracle
        if: ${{ always() && matrix.rust == 'x86_64-apple-darwin' && (steps.child-contract.outcome == 'success' || steps.child-contract.outcome == 'failure') }}
        working-directory: native/device-helper
        run: |
          status=0
          for attempt in 1 2 3 4 5; do
            echo "Intel real OS-pipe probe $attempt/5"
            cargo test --locked --release --target "${{ matrix.rust }}" --test lifetime -- --nocapture || status=1
          done
          exit "$status"
      - name: Native Linux candidate checks (synthetic sysfs and PTYs only)
        if: runner.os == 'Linux'
        working-directory: native/device-helper
        run: |
          cargo clippy --locked --all-targets --target "${{ matrix.rust }}" --features native-linux -- -D warnings
          cargo test --locked --target "${{ matrix.rust }}" --features native-linux
      - name: Build and install the Linux candidate without device discovery
        if: runner.os == 'Linux'
        run: |
          bun scripts/build-binaries.ts --target bun-linux-x64 --device-backend native --out-dir dist/native-linux-test
          helper=native/device-helper/target/x86_64-unknown-linux-musl/release/keyloom-device
          if readelf -l "$helper" | grep -q INTERP; then exit 1; fi
          if readelf -d "$helper" | grep -q NEEDED; then exit 1; fi
          bun scripts/smoke-device-helper.ts dist/native-linux-test/keyloom-linux-x64 --native-linux
          cd native/device-helper
          cargo build --locked --release --target "${{ matrix.rust }}"
      - name: Combined macOS checks and Apple Silicon release helper
        if: runner.os == 'macOS'
        working-directory: native/device-helper
        run: |
          cargo clippy --locked --all-targets --target "${{ matrix.rust }}" --features native-macos -- -D warnings
          cargo test --locked --target "${{ matrix.rust }}" --features native-macos
          if [ "${{ matrix.rust }}" = aarch64-apple-darwin ]; then
            cargo build --locked --release --target "${{ matrix.rust }}" --features native-macos
          fi
      - name: Combined synthetic installed journeys (no devices)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd native/device-helper
          cargo clippy --locked --all-targets --target "${{ matrix.rust }}" --features synthetic-macos -- -D warnings
          cargo test --locked --target "${{ matrix.rust }}" --features synthetic-macos
          cargo build --locked --release --target "${{ matrix.rust }}" --features synthetic-macos
          cp "target/${{ matrix.rust }}/release/keyloom-device" "target/${{ matrix.rust }}/release/keyloom-device-synthetic-macos"
          codesign --force --sign - "target/${{ matrix.rust }}/release/keyloom-device-synthetic-macos"
          cd ../..
          helper="$PWD/native/device-helper/target/${{ matrix.rust }}/release/keyloom-device-synthetic-macos"
          bun scripts/build-binaries.ts --target "${{ matrix.bun }}" --device-backend native --helper "$helper" --out-dir dist/native-combined-test
          bun scripts/smoke-native-combined.ts "dist/native-combined-test/keyloom-${{ matrix.rust == 'aarch64-apple-darwin' && 'darwin-arm64' || 'darwin-x64' }}" "$helper"
          cd native/device-helper
          if [ "${{ matrix.rust }}" = aarch64-apple-darwin ]; then
            cargo build --locked --release --target "${{ matrix.rust }}" --features native-macos
          else
            cargo build --locked --release --target "${{ matrix.rust }}"
          fi
      - name: Sign final macOS helper after all Cargo invocations
        if: runner.os == 'macOS'
        run: codesign --force --sign - native/device-helper/target/${{ matrix.rust }}/release/keyloom-device
      - name: Compile and install the paired CLI outside the repo
        if: runner.os != 'Windows'
        run: |
          bun scripts/build-binaries.ts --target "${{ matrix.bun }}" --helper native/device-helper/target/${{ matrix.rust }}/release/keyloom-device
          bun scripts/smoke-device-helper.ts dist/keyloom-${{ runner.os == 'macOS' && 'darwin' || 'linux' }}-${{ matrix.rust == 'aarch64-apple-darwin' && 'arm64' || 'x64' }}

      - name: Windows extraction and workflow policy tests (no devices)
        if: runner.os == 'Windows'
        run: bun test test/firmware/toolchain/device-helper-windows-extract.test.ts test/cli/windows-support.test.ts
      - name: Compile and install Windows pair outside the repo (no devices)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          bun scripts/build-binaries.ts --target bun-windows-x64 --helper native/device-helper/target/x86_64-pc-windows-msvc/release/keyloom-device.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/smoke-windows-install.ps1 -Binary dist/keyloom-windows-x64.exe

  # The desktop shell (26-desktop-app.md): Rust checks only; the .app itself is built by the release workflow.
  desktop:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop/tauri/src-tauri
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            desktop/tauri/src-tauri/target
          key: desktop-${{ hashFiles('desktop/tauri/src-tauri/Cargo.lock') }}
      # tauri-build insists the sidecar file exists; its contents don't matter to a check.
      - run: |
          mkdir -p binaries
          touch "binaries/keyloom-$(rustc -vV | sed -n 's/^host: //p')"
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features updater -- -D warnings
      - run: cargo test --locked

  # A board PR is data only, so this is the check that decides whether its folder is well formed (04).
  # It needs the network: `boards check` fetches each board's pinned firmware file to compare geometry.
  # Files at a pinned SHA never change, so they are cached by path and a warm run makes no requests.
  boards:
    runs-on: ubuntu-latest
    steps:
      # The runner context isn't available in job-level env, so the cache directory is set from a step.
      - run: echo "XDG_CACHE_HOME=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cache/keyloom/geometry
          key: board-geometry-${{ hashFiles('boards/**/board.json') }}
          restore-keys: board-geometry-
      - name: Check every board
        run: |
          status=0
          for dir in boards/*/*/; do
            dir="${dir%/}"
            # boards/_template holds the folders a contributor copies; it is not a board.
            case "$dir" in boards/_*) continue ;; esac
            echo "::group::$dir"
            bun src/cli/main.ts boards check "$dir" || status=1
            echo "::endgroup::"
          done
          exit "$status"
