name: ci

on:
  push:
  pull_request:
  # release.yml dispatches this on release-please's branch: the PR that bot opens with the
  # default token never starts pull_request workflows (docs/issues/release-pr-ci-never-runs.md).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
      - name: Dependency rules
        run: |
          if jq -e '.scripts.depcruise' package.json >/dev/null; then
            bun run depcruise
          else
            echo "No depcruise script yet, skipping."
          fi

  # The desktop shell (26-desktop-app.md): Rust checks only; the .app itself is built by the release workflow.
  desktop:
    runs-on: macos-15
    defaults:
      run:
        working-directory: desktop/tauri/src-tauri
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            desktop/tauri/src-tauri/target
          key: desktop-${{ hashFiles('desktop/tauri/src-tauri/Cargo.lock') }}
      # tauri-build insists the sidecar file exists; its contents don't matter to a check.
      - run: |
          mkdir -p binaries
          touch "binaries/keyloom-$(rustc -vV | sed -n 's/^host: //p')"
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features updater -- -D warnings
      - run: cargo test --locked

  # A board PR is data only, so this is the check that decides whether its folder is well formed (04).
  # It needs the network: `boards check` fetches each board's pinned firmware file to compare geometry.
  # Files at a pinned SHA never change, so they are cached by path and a warm run makes no requests.
  boards:
    runs-on: ubuntu-latest
    steps:
      # The runner context isn't available in job-level env, so the cache directory is set from a step.
      - run: echo "XDG_CACHE_HOME=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cache/keyloom/geometry
          key: board-geometry-${{ hashFiles('boards/**/board.json') }}
          restore-keys: board-geometry-
      - name: Check every board
        run: |
          status=0
          for dir in boards/*/*/; do
            dir="${dir%/}"
            # boards/_template holds the folders a contributor copies; it is not a board.
            case "$dir" in boards/_*) continue ;; esac
            echo "::group::$dir"
            bun src/cli/main.ts boards check "$dir" || status=1
            echo "::endgroup::"
          done
          exit "$status"
