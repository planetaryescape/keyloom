# release-please and the binary build share one workflow. A release created with the
# default GITHUB_TOKEN does not trigger other workflows, so the build has to be a job
# that needs the release-please job.
name: release

on:
  push:
    branches: [main]
  # Builds an existing release whose run failed after release-please created it (docs/issues/release-built-nothing-after-release-please-error.md).
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag with no assets yet, such as v0.53.1
        required: true

# Release runs take turns, so a rebuild of a tag can't upload alongside the push run that is still building it; the
# rebuild then finds the assets and stops. A newer push may replace a waiting push run, which is safe because
# release-please works from main's current state and still releases any merged PR left pending.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.existing.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.existing.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        if: github.event_name == 'push'
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A release that already has assets is never rebuilt: its published binaries and checksums stay as they are.
      - if: github.event_name == 'workflow_dispatch'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          if [ "$assets" != 0 ]; then echo "::error::$TAG already has $assets assets; build a new release instead."; exit 1; fi
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  # The release PR is opened with the default token, so GitHub starts no pull_request run for it.
  # A workflow_dispatch from that token does run, on the PR's head commit, so its checks show on the PR.
  ci-on-release-pr:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  build-native:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, rust: aarch64-apple-darwin, bun: bun-darwin-arm64, asset: keyloom-darwin-arm64 }
          - { os: macos-15-intel, rust: x86_64-apple-darwin, bun: bun-darwin-x64, asset: keyloom-darwin-x64 }
          - { os: ubuntu-22.04, rust: x86_64-unknown-linux-musl, bun: bun-linux-x64, asset: keyloom-linux-x64 }
          - { os: windows-2022, rust: x86_64-pc-windows-msvc, bun: bun-windows-x64, asset: keyloom-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build native locked helper
        shell: bash
        working-directory: native/device-helper
        run: |
          rustup show
          rustup target add "${{ matrix.rust }}"
          features=""
          if [ "${{ matrix.rust }}" = aarch64-apple-darwin ]; then features="--features native-macos"; fi
          cargo build --locked --release --target "${{ matrix.rust }}" $features
          cargo test --locked --release --target "${{ matrix.rust }}" $features --test lifetime -- --nocapture
      - name: Sign and notarise visible Rust before hashing and embedding
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID_NAME: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID_VALUE: ${{ secrets.APPLE_TEAM_ID }}
        run: sh scripts/sign-device-helper.sh native/device-helper/target/${{ matrix.rust }}/release/keyloom-device
      - name: Verify static Linux helper
        if: runner.os == 'Linux'
        run: |
          file native/device-helper/target/${{ matrix.rust }}/release/keyloom-device
          if readelf -l native/device-helper/target/${{ matrix.rust }}/release/keyloom-device | grep -q INTERP; then exit 1; fi
      - name: Build the paired CLI and run the real installer smoke
        if: runner.os != 'Windows'
        run: |
          bun scripts/build-binaries.ts --target "${{ matrix.bun }}" --helper native/device-helper/target/${{ matrix.rust }}/release/keyloom-device
          bun scripts/smoke-device-helper.ts dist/${{ matrix.asset }}
      - name: Build and install the unsigned Windows pair (no devices)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          bun scripts/build-binaries.ts --target bun-windows-x64 --helper native/device-helper/target/x86_64-pc-windows-msvc/release/keyloom-device.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/smoke-windows-install.ps1 -Binary dist/keyloom-windows-x64.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: keyloom-cli-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 3

  # Fan in exactly four verified binaries. Per-target builders must not overwrite the published checksum list.
  build-binaries:
    needs: [release-please, build-native]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: keyloom-cli-*
          path: dist
          merge-multiple: true
      - name: Complete release checksums
        run: |
          set -eu
          cd dist
          test "$(find . -maxdepth 1 -type f -name 'keyloom-*' | wc -l)" -eq 4
          for asset in keyloom-darwin-arm64 keyloom-darwin-x64 keyloom-linux-x64 keyloom-windows-x64.exe; do test -s "$asset"; done
          sha256sum keyloom-darwin-arm64 keyloom-darwin-x64 keyloom-linux-x64 keyloom-windows-x64.exe > SHA256SUMS
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/keyloom-* dist/SHA256SUMS --repo "$GITHUB_REPOSITORY"

      - name: Record Windows signing limitation in release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$RUNNER_TEMP/windows-notes.md"
          printf '\nWindows x64: the CLI and embedded diagnostics-only helper are unsigned because no Windows code-signing credential is configured. SmartScreen or antivirus may warn or block execution; keep OS protections enabled. HID/COM, lab, build, flash, sync, kanata and serve are not available on Windows yet (rung 24f).\n' >> "$RUNNER_TEMP/windows-notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/windows-notes.md"

  # The desktop app (26-desktop-app.md). It wraps the binary build-binaries just attached, so it needs that job. Signing, notarising and the
  # updater each switch on when their secrets exist; without them the job still builds and uploads the app, and says what is missing.
  build-desktop:
    needs: [release-please, build-binaries]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
      CARGO_BUILD_JOBS: 4
      # Signing: the Developer ID certificate as a base64 .p12, its password, and the identity's name.
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_SIGNING_IDENTITY_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      # Notarising, either with an App Store Connect API key ...
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      # ... or with an Apple ID and an app-specific password.
      APPLE_ID_NAME: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID_VALUE: ${{ secrets.APPLE_TEAM_ID }}
      # Auto-update: Tauri's own signing key and its public half.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Take the sidecar from the release
        working-directory: desktop/tauri
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern keyloom-darwin-arm64 --dir "$RUNNER_TEMP/sidecar"
          sh scripts/fetch-sidecar.sh "$RUNNER_TEMP/sidecar/keyloom-darwin-arm64"
          bun install --frozen-lockfile
      - name: Import the signing certificate
        if: env.APPLE_CERT_P12_BASE64 != ''
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
      - name: Build, sign and notarise when the credentials exist
        working-directory: desktop/tauri
        run: |
          set -eu
          args=""
          if [ -n "$APPLE_CERT_P12_BASE64" ]; then
            export APPLE_SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY_NAME"
          else
            echo "::warning::No APPLE_CERT_P12_BASE64 secret: the app is built unsigned."
          fi
          if [ -n "$APPLE_CERT_P12_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER_ID" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$APPLE_API_KEY_ID" APPLE_API_ISSUER="$APPLE_API_ISSUER_ID" APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            echo "NOTARISED=yes" >> "$GITHUB_ENV"
          elif [ -n "$APPLE_CERT_P12_BASE64" ] && [ -n "$APPLE_ID_NAME" ] && [ -n "$APPLE_APP_PASSWORD" ] && [ -n "$APPLE_TEAM_ID_VALUE" ]; then
            export APPLE_ID="$APPLE_ID_NAME" APPLE_PASSWORD="$APPLE_APP_PASSWORD" APPLE_TEAM_ID="$APPLE_TEAM_ID_VALUE"
            echo "NOTARISED=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::No notarisation credentials (or no signing certificate): the app is not notarised, so Gatekeeper rejects a downloaded copy."
            echo "NOTARISED=no" >> "$GITHUB_ENV"
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_UPDATER_PUBKEY" ]; then
            jq --arg key "$TAURI_UPDATER_PUBKEY" '.plugins.updater.pubkey = $key' tauri.updater.example.json > tauri.updater.json
            args="--config tauri.updater.json --features updater"
            echo "UPDATER=yes" >> "$GITHUB_ENV"
          else
            echo "UPDATER=no" >> "$GITHUB_ENV"
          fi
          # shellcheck disable=SC2086
          scripts/build.sh $args
      - name: Package and attach to the release
        working-directory: desktop/tauri/src-tauri/target/release/bundle/macos
        run: |
          set -eu
          version="${TAG#v}"
          zip="keyloom-$version-darwin-arm64.app.zip"
          ditto -c -k --keepParent keyloom.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
          gh release upload "$TAG" "$zip" "$zip.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          if [ "$UPDATER" = yes ]; then
            sig="$(cat keyloom.app.tar.gz.sig)"
            jq -n --arg v "$version" --arg sig "$sig" --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/keyloom.app.tar.gz" \
              '{version: $v, platforms: {"darwin-aarch64": {signature: $sig, url: $url}}}' > latest.json
            gh release upload "$TAG" keyloom.app.tar.gz keyloom.app.tar.gz.sig latest.json --repo "$GITHUB_REPOSITORY" --clobber
          fi
          if [ "$NOTARISED" = no ]; then
            body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)"
            printf '%s\n\n> The macOS app in this release is not notarised yet, so macOS will refuse to open a downloaded copy until the notarisation credentials are added (see desktop/tauri/README.md).\n' "$body" > "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          fi
