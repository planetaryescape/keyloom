name: device-helper-signing-preflight

# Exercise existing signing credentials on trusted main before merging a release PR.
# This builds scratch diagnostics artifacts only: no publishing, tags or device access.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-preflight:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, rust: aarch64-apple-darwin, bun: bun-darwin-arm64, asset: keyloom-darwin-arm64 }
          - { os: macos-15-intel, rust: x86_64-apple-darwin, bun: bun-darwin-x64, asset: keyloom-darwin-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build and test native locked helper
        working-directory: native/device-helper
        run: |
          rustup show
          rustup target add "${{ matrix.rust }}"
          # Same feature mapping as release.yml: arm64 ships the native helper (D-433).
          features=""
          if [ "${{ matrix.rust }}" = aarch64-apple-darwin ]; then features="--features native-macos"; fi
          cargo build --locked --release --target "${{ matrix.rust }}" $features
          cargo test --locked --release --target "${{ matrix.rust }}" $features --test lifetime -- --nocapture
      - name: Require Developer ID signing and accepted notarisation
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID_NAME: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID_VALUE: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          : "${APPLE_CERT_P12_BASE64:?Developer ID certificate is required}"
          : "${APPLE_CERT_PASSWORD:?Certificate password is required}"
          : "${APPLE_SIGNING_IDENTITY_NAME:?Signing identity is required}"
          if ! { test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER_ID" && test -n "$APPLE_API_KEY_P8"; } &&
             ! { test -n "$APPLE_ID_NAME" && test -n "$APPLE_APP_PASSWORD" && test -n "$APPLE_TEAM_ID_VALUE"; }; then
            echo '::error::Existing notarisation credentials are required; no unsigned or unnotarised preflight.'
            exit 1
          fi
          helper="native/device-helper/target/${{ matrix.rust }}/release/keyloom-device"
          sh scripts/sign-device-helper.sh "$helper"
          codesign -d --verbose=4 "$helper" 2> "$RUNNER_TEMP/helper-signature.txt"
          grep -q '^Authority=Developer ID Application:' "$RUNNER_TEMP/helper-signature.txt"
      - name: Build paired CLI and run the real installer smoke
        run: |
          bun scripts/build-binaries.ts --target "${{ matrix.bun }}" --helper native/device-helper/target/${{ matrix.rust }}/release/keyloom-device
          bun scripts/smoke-device-helper.ts dist/${{ matrix.asset }}
